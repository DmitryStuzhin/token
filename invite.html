<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Приглашение — arcs.studio</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<script src="assets/db.js"></script>
<script src="assets/core.js"></script>
<script src="assets/ui.js"></script>
<script>
(function () {
  const C = Core;
  const S = UI.qs('as') || UI.STUDENT;          /* кто принимает приглашение */
  const code = UI.qs('code') || '';
  const inv = C.inviteByCode(code);
  const st = C.inviteState(inv);
  const target = C.inviteTarget(inv);
  const joined = inv && C.inviteAlreadyJoined(inv, S);
  const me = C.studentUser(S);

  function card(inner) {
    return `<div style="max-width:620px;margin:0 auto">${inner}</div>`;
  }

  function whatHTML() {
    if (!target) return '';
    if (target.kind === 'group') {
      const g = target.group;
      const stats = C.groupStats(g.id);
      return `
        <div class="field"><div class="k">Вы вступаете в группу</div>
          <div class="v" style="font-size:18px">${UI.esc(g.title)}</div></div>
        <div class="field"><div class="k">Предмет</div>
          <div class="v">${UI.esc(target.subject.name)} · уровень: ${UI.esc(g.level)}</div></div>
        <div class="field"><div class="k">Расписание</div><div class="v">${UI.esc(g.schedule)}</div></div>
        <div class="field"><div class="k">Репетитор</div>
          <div class="v">${UI.esc(target.tutor.user.name)}</div></div>
        <div class="field" style="margin-bottom:0"><div class="k">Мест</div>
          <div class="v">${stats.size} из ${g.capacity} занято${
            target.seatsLeft != null ? ' · по ссылке осталось ' + target.seatsLeft : ''}</div></div>`;
    }
    if (target.kind === 'enrollment') {
      return `
        <div class="field"><div class="k">Вы записываетесь на индивидуальные занятия</div>
          <div class="v" style="font-size:18px">${UI.esc(target.subject.name)}</div></div>
        <div class="field"><div class="k">Репетитор</div>
          <div class="v">${UI.esc(target.tutor.user.name)} · ${target.tutor.profile.yearsExp}
            ${C.plural(target.tutor.profile.yearsExp,'год','года','лет')} опыта</div></div>
        <div class="field" style="margin-bottom:0"><div class="k">Что появится в кабинете</div>
          <div class="v" style="font-weight:400;font-size:14px">Расписание занятий, домашние задания,
            статистика по этому предмету</div></div>`;
    }
    if (target.kind === 'guardian') {
      return `
        <div class="field"><div class="k">Доступ родителя к прогрессу</div>
          <div class="v" style="font-size:18px">${UI.esc(target.student.user.name)}</div></div>
        <div class="field" style="margin-bottom:0"><div class="k">Что будет видно</div>
          <div class="v" style="font-weight:400;font-size:14px">Расписание, посещаемость, статусы и оценки д/з,
            статистика. Решения ребёнка и внутренние заметки репетитора — нет.</div></div>`;
    }
    return '';
  }

  function body() {
    if (!code) {
      return card(`<section class="card">
        <div class="head"><h2>Введите код приглашения</h2></div>
        <p class="muted small" style="margin-bottom:14px">
          Ссылка вида <code>invite.html?code=КОД</code> приходит от репетитора.</p>
        <div class="answer">
          <input id="code" placeholder="например DM-INF-7K2P" style="text-transform:uppercase">
          <button class="btn" id="go">Открыть</button>
        </div>
      </section>`);
    }

    if (!inv || !st.ok) {
      return card(`<section class="card">
        <div class="head"><h2>Приглашение недоступно</h2>
          <span class="badge b-red">${UI.esc(st.label)}</span></div>
        <div class="verdict v-no">Код <b>${UI.esc(code)}</b> — ${UI.esc(st.label.toLowerCase())}.</div>
        <p class="muted small" style="margin-top:14px">
          Попросите репетитора выпустить новую ссылку: старая могла истечь,
          исчерпать лимит переходов или быть отозвана.</p>
        <a class="btn ghost" style="margin-top:14px" href="index.html">В кабинет</a>
      </section>`);
    }

    if (joined) {
      return card(`<section class="card">
        <div class="head"><h2>Вы уже присоединены</h2><span class="badge b-green">активно</span></div>
        ${whatHTML()}
        <a class="btn" style="margin-top:16px" href="index.html">Открыть кабинет</a>
      </section>`);
    }

    return card(`
      <section class="card">
        <div class="head">
          <div><h2>Приглашение от ${UI.esc(target.tutor ? target.tutor.user.name : 'ученика')}</h2>
            <div class="hint">код ${UI.esc(inv.code)}${
              inv.expiresAt ? ' · действует до ' + C.fmtDate(inv.expiresAt) : ''}</div></div>
          ${target.subject ? UI.subjectTag(target.subject) : ''}
        </div>
        ${inv.note ? `<div class="note n-blue" style="margin-bottom:16px">${UI.esc(inv.note)}</div>` : ''}
        ${whatHTML()}
      </section>

      <section class="card" style="margin-top:14px">
        <div class="head"><h2>Вы входите как</h2></div>
        <div class="row">
          ${UI.avatar(me.name)}
          <span class="grow"><span class="t">${UI.esc(me.name)}</span>
            <span class="s">${C.student(S).grade} класс · ${UI.esc(C.student(S).school)}</span></span>
        </div>
        <div class="answer">
          <span class="muted small" style="flex:1">Привязка создаётся сразу и видна репетитору.</span>
          <button class="btn" id="accept">Присоединиться</button>
        </div>
        <div id="out"></div>
      </section>

      <div class="note n-grey" style="margin-top:14px">
        Это <b>Invite</b> из доменной модели: одна таблица закрывает индивидуальную привязку,
        вступление в группу и доступ родителя — отличается только <code>kind</code>.
        Принятие создаёт <code>Enrollment</code> или <code>GroupMember</code>, счётчик переходов растёт.
      </div>`);
  }

  UI.page({
    active:'home',
    head:{ title:'Приглашение', sub:'Присоединение к репетитору или группе по ссылке' },
    body: body(),
  });

  const go = document.getElementById('go');
  if (go) go.addEventListener('click', () => {
    const v = document.getElementById('code').value.trim();
    if (v) location.href = 'invite.html?code=' + encodeURIComponent(v);
  });

  const acc = document.getElementById('accept');
  if (acc) acc.addEventListener('click', () => {
    const res = C.acceptInvite(code, S);
    const out = document.getElementById('out');
    if (!res.ok) { out.innerHTML = `<div class="verdict v-no">${UI.esc(res.error)}</div>`; return; }
    acc.disabled = true;
    const t = res.target;
    out.innerHTML = `<div class="verdict v-ok">
      Готово. ${t.kind === 'group' ? 'Вы в группе «' + UI.esc(t.group.title) + '»'
        : 'Занятия по предмету «' + UI.esc(t.subject.name) + '» добавлены'}.
      Групповые задания уже развернулись на вас.
      <a href="index.html">открыть кабинет →</a></div>`;
  });
})();
</script>
</body>
</html>
