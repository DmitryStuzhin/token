<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Занятие — Token</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<script src="/api/state.js"></script>
<script src="/shared/core.js"></script>
<script src="/assets/store.js"></script>
<script src="/assets/api.js"></script>
<script src="/assets/auth.js"></script>
<script src="/assets/ui.js"></script>
<script>
(function () {
  const ses = Auth.require();
  if (!ses) return;
  const C = Core;
  const asTutor = ses.role === 'tutor';

  /* какое занятие показываем */
  let les = UI.qs('lesson') ? C.lesson(UI.qs('lesson')) : null;
  if (!les && !asTutor) les = C.nextLesson(ses.studentId);
  if (!les && asTutor) {
    const mine = C.tutorToday(ses.tutorId);
    les = mine[0] || C.db.lessons
      .filter(l => l.tutorId === ses.tutorId && l.status === 'planned')
      .sort((a, b) => new Date(a.startsAt) - new Date(b.startsAt))[0] || null;
  }

  if (!les) {
    UI.page({ session:ses, active:'lesson', head:{ title:'Занятие' },
      body:`<div class="card">${UI.empty('Занятий пока нет', asTutor
        ? 'Создайте занятие на странице <a href="tutor.html">Сегодня</a> — там же список учеников.'
        : 'Занятие появится, когда репетитор его назначит.')}</div>` });
    return;
  }

  const grp = les.groupId ? C.group(les.groupId) : null;
  const roster = C.studentsOfLesson(les);
  const watchSid = asTutor ? (UI.qs('student') || roster[0] || null) : ses.studentId;
  const watchUser = watchSid ? C.studentUser(watchSid) : null;
  const live = C.lessonIsLive(les);
  const call = (les.links || []).find(l => l.type === 'call');
  const subj = C.subject(les.subjectId);

  /* ── шапка ──────────────────────────────────────────────────── */
  function bannerHTML() {
    return `<section class="banner">
      <div>
        <div class="lbl">${live ? '● занятие идёт'
          : les.status === 'done' ? 'занятие проведено' : 'занятие запланировано'}</div>
        <div class="val">${C.relDay(les.startsAt) || C.fmtDate(les.startsAt)} в ${C.fmtTime(les.startsAt)} · ${les.durationMin} мин</div>
        <div class="meta">${UI.esc(subj.name)} ·
          ${grp ? 'группа «' + UI.esc(grp.title) + '», ' + roster.length + ' ' +
              C.plural(roster.length,'участник','участника','участников')
            : asTutor ? 'ученик: ' + UI.esc(watchUser ? watchUser.name : '—')
            : 'репетитор: ' + UI.esc(((C.tutorOf(ses.studentId, les.subjectId) || {}).user || {}).name || '—')}</div>
      </div>
      <div class="acts">
        ${call ? `<a class="btn white" href="${UI.esc(call.url)}" target="_blank" rel="noopener">Подключиться</a>`
               : asTutor ? '' : '<span class="muted small" style="color:rgba(255,255,255,.8)">ссылки на созвон пока нет</span>'}
        ${asTutor && les.status !== 'done'
          ? `<button class="btn ghost" id="finish" style="color:#fff;border-color:rgba(255,255,255,.6)">Завершить</button>` : ''}
      </div>
    </section>`;
  }

  /* ── ссылки ─────────────────────────────────────────────────── */
  function linksHTML() {
    const list = les.links || [];
    return `<div class="card">
      <div class="head"><h2>Ссылки занятия</h2>
        ${asTutor ? '<a href="#" id="addlink">добавить</a>' : ''}</div>
      ${list.length ? `<div class="links">${list.map((l, i) => UI.linkRow(l, i, asTutor)).join('')}</div>`
        : UI.empty('Ссылок нет', asTutor
            ? 'Добавьте созвон и доску — ученик увидит их сразу.'
            : 'Репетитор добавит ссылки к началу занятия.')}
      <div id="linkform"></div>
      ${asTutor ? `<div class="note n-grey" style="margin-top:12px">
        Тип, а не отдельные поля: созвон, доска, материал. Первая ссылка типа
        «созвон» становится кнопкой «Подключиться» у ученика.</div>` : ''}
    </div>`;
  }

  function linkFormHTML() {
    return `<div class="card" style="margin-top:12px;background:var(--bg)">
      <div class="head"><h2>Новая ссылка</h2><a href="#" id="closelink">закрыть</a></div>
      <div class="fld-row" style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
        <label style="width:150px">
          <div class="muted small" style="margin-bottom:5px">Тип</div>
          <select id="l-type" style="width:100%;padding:10px 12px;border:1.5px solid var(--line);
            border-radius:10px;background:var(--panel);color:var(--text);font:inherit">
            <option value="call">созвон</option>
            <option value="board">доска</option>
            <option value="material">материал</option>
          </select></label>
        <label style="flex:2;min-width:220px">
          <div class="muted small" style="margin-bottom:5px">Ссылка</div>
          <input id="l-url" placeholder="https://telemost.yandex.ru/j/…"
            style="width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;
                   background:var(--panel);color:var(--text);font:inherit"></label>
        <label style="flex:1;min-width:150px">
          <div class="muted small" style="margin-bottom:5px">Подпись</div>
          <input id="l-label" placeholder="необязательно"
            style="width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;
                   background:var(--panel);color:var(--text);font:inherit"></label>
        <button class="btn" id="l-add">Добавить</button>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
        <button class="btn sm grey preset" data-t="call" data-u="https://telemost.yandex.ru/j/00000000000000">Телемост</button>
        <button class="btn sm grey preset" data-t="call" data-u="https://zoom.us/j/0000000000">Zoom</button>
        <button class="btn sm grey preset" data-t="board" data-u="https://excalidraw.com/#room=token-lesson">Excalidraw</button>
        <button class="btn sm grey preset" data-t="board" data-u="https://miro.com/app/board/demo/">Miro</button>
        <span class="muted small" style="align-self:center">подставить пример</span>
      </div>
      <div id="l-out"></div>
    </div>`;
  }

  /* ── задания занятия ────────────────────────────────────────── */
  function tasksHTML() {
    const ids = les.taskIds || [];
    if (!ids.length) return `<div class="card">
      <div class="head"><h2>Задания занятия</h2>
        ${asTutor ? '<a href="#" id="addtask">прикрепить из банка</a>' : ''}</div>
      ${UI.empty('Заданий пока нет', asTutor
        ? 'Прикрепите задачи из банка — ученик увидит их сразу.'
        : 'Репетитор прикрепит задачи во время занятия.')}
      <div id="picker-slot"></div></div>`;

    const rows = ids.map(id => {
      const t = C.task(id);
      const at = watchSid ? (C.attemptFor(watchSid, id, { lessonId: les.id }) || {}) : {};
      const state = !at.status || at.status === 'issued' ? { m:'○', c:'var(--muted)', s:'не открыто' }
        : at.status === 'in_progress' ? { m:'◐', c:'var(--brand)', s:'решает · ' + C.fmtDurShort(at.activeSeconds) }
        : at.status === 'submitted' ? { m:'◍', c:'var(--amber)', s:'ждёт проверки' }
        : at.isCorrect ? { m:'●', c:'var(--green)', s:'верно · ' + C.fmtDurShort(at.activeSeconds) }
        : { m:'✕', c:'var(--red)', s:'неверно · ' + C.fmtDurShort(at.activeSeconds) };
      const href = asTutor ? '#' : `task.html?task=${id}&lesson=${les.id}`;
      return `<a class="row" href="${href}" ${asTutor ? 'onclick="return false"' : ''}>
        <span style="color:${state.c};font-size:17px;width:16px;text-align:center">${state.m}</span>
        <span class="grow"><span class="t">№${t ? t.number : '?'} · ${UI.esc(t ? t.title : id)}</span>
          <span class="s">${t ? UI.esc((C.topic(t.topicId)||{}).name || '') : ''}${
            t && !t.autoCheck ? ' · проверяет репетитор' : ''}</span></span>
        <span class="r">${state.s}</span>
        ${asTutor ? `<button class="btn sm grey rm-task" data-id="${id}">убрать</button>` : ''}</a>`;
    }).join('');

    return `<div class="card">
      <div class="head"><h2>Задания занятия</h2>
        ${asTutor ? '<a href="#" id="addtask">прикрепить из банка</a>' : ''}</div>
      <div class="row-list">${rows}</div>
      <div id="picker-slot"></div></div>`;
  }

  function pickerHTML() {
    const pool = C.db.tasks.filter(t => t.subjectId === les.subjectId);
    const nums = [...new Set(pool.map(t => t.number))].sort((a, b) => a - b);
    return `<div class="card" id="picker" style="margin-top:12px;background:var(--bg)">
      <div class="head"><h2>Банк задач · ${UI.esc(subj.name)}</h2><a href="#" id="closepick">закрыть</a></div>
      <div class="filters" style="margin-bottom:12px">
        <button data-num="all" class="on">Все</button>
        ${nums.map(n => `<button data-num="${n}">№${n}</button>`).join('')}
      </div>
      <div class="row-list" id="pool">${pool.map(t => taskRow(t)).join('')}</div>
    </div>`;
  }

  function taskRow(t) {
    const on = (les.taskIds || []).includes(t.id);
    return `<a class="row" href="#" data-pick="${t.id}" data-num="${t.number}" onclick="return false">
      <span class="badge b-blue">№${t.number}</span>
      <span class="grow"><span class="t">${UI.esc(t.title)}</span>
        <span class="s">${UI.esc((C.topic(t.topicId)||{}).name||'')} · сложность ${t.difficulty}/3
          · ${t.autoCheck ? 'автопроверка' : 'ручная проверка'}</span></span>
      <span class="r">${on ? 'прикреплено' : 'прикрепить'}</span></a>`;
  }

  /* ── наблюдение ─────────────────────────────────────────────── */
  function rosterHTML() {
    if (!grp) return '';
    return `<div class="card">
      <div class="head"><h2>Кто на занятии</h2><span class="muted small">${roster.length} из ${grp.capacity}</span></div>
      <div class="tasklist">${roster.map(sid => {
        const u = C.studentUser(sid);
        const solved = (les.taskIds || []).filter(tid => {
          const a = C.attemptFor(sid, tid, { lessonId: les.id });
          return a && a.isCorrect === true;
        }).length;
        return `<a href="lesson.html?lesson=${les.id}&student=${sid}" class="${sid === watchSid ? 'cur' : ''}">
          <span class="grow">${UI.esc(u.name)}</span>
          <span class="muted small">${solved} из ${(les.taskIds||[]).length}</span></a>`;
      }).join('')}</div></div>`;
  }

  function watchHTML() {
    const ids = les.taskIds || [];
    const cur = watchSid ? ids.map(id => C.attemptFor(watchSid, id, { lessonId: les.id }))
      .filter(Boolean).sort((a, b) => (b.activeSeconds || 0) - (a.activeSeconds || 0))[0] : null;
    const t = cur ? C.task(cur.taskId) : null;
    return `<div class="card">
      <div class="head">
        <h2>Экран ученика${watchUser ? ' · ' + UI.esc(watchUser.name.split(' ')[0]) : ''}</h2>
        <span class="muted small" id="watch-head"><span class="dot ${cur && cur.status === 'in_progress' ? '' : 'off'}"></span>
          живой канал</span>
      </div>
      <div id="watch">
        ${!cur || !t ? UI.empty('Ученик ещё не открыл задание', 'Как только откроет — здесь появится его черновик.')
          : `<div class="hint" style="margin-bottom:10px">Сейчас: №${t.number} · ${UI.esc(t.title)}
              · ${C.fmtDur(cur.activeSeconds)} · попыток ${cur.tries || 0}${
              cur.answer ? ' · ответ: ' + UI.esc(cur.answer) : ''}</div>
             <div class="editor"><pre id="watch-code">${UI.esc(cur.code || '— пусто —')}</pre></div>`}
      </div>
      <div class="note n-blue" style="margin-top:12px">
        Черновик приходит по WebSocket из комнаты <code>lesson:${les.id}</code>.
        Соединение авторизовано той же сессией — посторонний в комнату не попадёт.
      </div></div>`;
  }

  function noteHTML() {
    const n = les.note;
    return `<div class="card">
      <div class="head"><h2>Заметка по занятию</h2>
        ${n ? `<span class="badge b-grey">видит: ${
          n.visibility === 'parent' ? 'ученик и родитель' :
          n.visibility === 'student' ? 'только ученик' : 'только репетитор'}</span>` : ''}</div>
      ${n ? `<p style="font-size:14.5px">${UI.esc(n.text)}</p>`
          : UI.empty('Заметки нет', asTutor ? 'Появится после занятия.' : 'Репетитор добавит после занятия.')}
    </div>`;
  }

  const body = asTutor
    ? `${bannerHTML()}
       <div class="cols c2w">
         <div class="stack">${watchHTML()}${tasksHTML()}</div>
         <div class="stack">${rosterHTML()}${linksHTML()}${noteHTML()}</div>
       </div>`
    : `${bannerHTML()}
       <div class="cols c2w">
         <div class="stack">${tasksHTML()}${noteHTML()}</div>
         <div class="stack">${linksHTML()}
           <div class="note n-blue">Во время занятия репетитор видит ваш черновик кода —
             так он быстрее подскажет. Черновик и время уходят на сервер сами.</div>
         </div>
       </div>`;

  /* соединение с комнатой занятия: одно на обе роли */
  function connectLive(wants, onSnapshot) {
    let ws = null, timer = null, alive = false;
    const url = (location.protocol === 'https:' ? 'wss://' : 'ws://') +
      location.host + '/live?lesson=' + encodeURIComponent(les.id);
    function open() {
      try { ws = new WebSocket(url); } catch (e) { return retry(); }
      ws.onopen = () => { alive = true; };
      ws.onmessage = ev => {
        let msg = null;
        try { msg = JSON.parse(ev.data); } catch (e) { return; }
        if (msg.type === 'snapshot' && onSnapshot && wants(msg.studentId)) onSnapshot(msg);
      };
      ws.onclose = () => { alive = false; retry(); };
      ws.onerror = () => { try { ws.close(); } catch (e) {} };
    }
    function retry() {
      clearTimeout(timer);
      timer = setTimeout(open, 3000);      /* сервер перезапустили — вернёмся сами */
    }
    open();
    return { send: m => { if (alive) try { ws.send(JSON.stringify(m)); } catch (e) {} } };
  }

  UI.page({
    session: ses,
    active: 'lesson',
    head:{ title: asTutor ? 'Ведение занятия' : 'Занятие', sub: C.fmtDateFull(les.startsAt) },
    body,
  });

  /* ── ссылки: добавление и удаление ──────────────────────────── */
  if (asTutor) {
    const addLink = document.getElementById('addlink');
    if (addLink) addLink.addEventListener('click', e => {
      e.preventDefault();
      const slot = document.getElementById('linkform');
      slot.innerHTML = linkFormHTML();
      document.getElementById('closelink').addEventListener('click', ev => { ev.preventDefault(); slot.innerHTML = ''; });
      slot.querySelectorAll('.preset').forEach(b => b.addEventListener('click', () => {
        document.getElementById('l-type').value = b.dataset.t;
        document.getElementById('l-url').value = b.dataset.u;
      }));
      document.getElementById('l-add').addEventListener('click', async () => {
        try {
          await Api.addLink(les.id, {
            type: document.getElementById('l-type').value,
            url: document.getElementById('l-url').value,
            label: document.getElementById('l-label').value,
          });
          location.reload();
        } catch (e) {
          document.getElementById('l-out').innerHTML = `<div class="verdict v-no">${UI.esc(e.message)}</div>`;
        }
      });
    });

    document.querySelectorAll('.rm-link').forEach(b => b.addEventListener('click', async () => {
      try { await Api.removeLink(les.id, +b.dataset.i); location.reload(); }
      catch (e) { alert(e.message); }
    }));

    /* ── прикрепление задач ─────────────────────────────────── */
    const addTask = document.getElementById('addtask');
    if (addTask) addTask.addEventListener('click', e => {
      e.preventDefault();
      const slot = document.getElementById('picker-slot');
      slot.innerHTML = pickerHTML();
      slot.scrollIntoView({ behavior:'smooth', block:'nearest' });
      document.getElementById('closepick').addEventListener('click', ev => { ev.preventDefault(); slot.innerHTML = ''; });
      slot.querySelectorAll('[data-num]').forEach(b => {
        if (b.tagName !== 'BUTTON') return;
        b.addEventListener('click', () => {
          slot.querySelectorAll('.filters button').forEach(x => x.classList.toggle('on', x === b));
          const n = b.dataset.num;
          slot.querySelectorAll('#pool .row').forEach(r =>
            r.style.display = (n === 'all' || r.dataset.num === n) ? '' : 'none');
        });
      });
      slot.querySelectorAll('[data-pick]').forEach(a => a.addEventListener('click', async () => {
        try { await Api.attachTask(les.id, a.dataset.pick); location.reload(); }
        catch (e) { alert(e.message); }
      }));
    });

    document.querySelectorAll('.rm-task').forEach(b => b.addEventListener('click', async e => {
      e.preventDefault(); e.stopPropagation();
      try { await Api.detachTask(les.id, b.dataset.id); location.reload(); }
      catch (err) { alert(err.message); }
    }));

    const fin = document.getElementById('finish');
    if (fin) fin.addEventListener('click', async () => {
      if (!confirm('Отметить занятие проведённым? Спишется одно занятие с абонемента ученика.')) return;
      try { await Api.setLessonStatus(les.id, 'done'); location.reload(); }
      catch (e) { alert(e.message); }
    });

    /* ── живой просмотр экрана ученика по WebSocket ─────────── */
    connectLive(sid => sid === watchSid, payload => {
      const top = (payload.attempts || [])
        .slice().sort((a, b) => (b.activeSeconds || 0) - (a.activeSeconds || 0))[0];
      if (!top) return;
      const pre = document.getElementById('watch-code');
      if (pre && pre.textContent !== (top.code || '— пусто —')) pre.textContent = top.code || '— пусто —';
      const dot = document.querySelector('#watch-head .dot');
      if (dot) dot.classList.toggle('off', top.status !== 'in_progress');
    });
  }
})();
</script>
</body>
</html>
