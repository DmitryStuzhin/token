<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Группы — Token</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<script src="/api/v1/screens/groups.js"></script>
<script src="/shared/core.js"></script>
<script src="/assets/store.js"></script>
<script src="/assets/api.js"></script>
<script src="/assets/auth.js"></script>
<script src="/assets/ui.js"></script>
<script>
(function () {
  const ses = Auth.require('tutor');
  if (!ses) return;
  const C = Core;
  const T = ses.tutorId;
  const tp = C.tutorProfile(T);
  const groups = C.groupsOfTutor(T);

  function tableHTML() {
    if (!groups.length) return `<section class="card">
      <div class="head"><h2>Группы</h2></div>
      ${UI.empty('Групп пока нет',
        'Группа — контейнер: занятие и задание выдаются всем сразу, а статистика остаётся по каждому ученику.')}
      <button class="btn" style="margin-top:14px" id="newgroup">Создать группу</button>
    </section>`;

    const rows = groups.map(g => {
      const gs = C.groupStats(g.id);
      const inv = C.db.invites.find(i => i.groupId === g.id && C.inviteState(i).ok);
      const next = gs.lessons.find(l => l.status === 'planned' && new Date(l.startsAt) > Date.now());
      return `<tr>
        <td><b>${UI.esc(g.title)}</b>
          <div class="muted small">${UI.esc(g.level)}${g.schedule ? ' · ' + UI.esc(g.schedule) : ''}</div></td>
        <td>${UI.subjectTag(C.subject(g.subjectId))}</td>
        <td class="num">${gs.size} / ${g.capacity}</td>
        <td class="num" style="color:${UI.pctColor(gs.avgAccuracy)}">${gs.avgAccuracy == null ? '—' : gs.avgAccuracy + '%'}</td>
        <td class="num" style="color:${UI.pctColor(gs.avgAttendance)}">${gs.avgAttendance == null ? '—' : gs.avgAttendance + '%'}</td>
        <td class="muted small">${next ? (C.relDay(next.startsAt) || C.fmtDate(next.startsAt)) + ', ' + C.fmtTime(next.startsAt) : '—'}</td>
        <td>${inv ? '<span class="badge b-blue">набор открыт</span>'
                  : '<span class="muted small">нет ссылки</span>'}</td>
        <td class="num"><a class="btn sm ghost" href="/group.html?group=${g.id}">Открыть</a></td>
      </tr>`;
    }).join('');

    return `<section class="card">
      <div class="head"><div><h2>Группы</h2>
        <div class="hint">Занятия и задания адресуются группе, статистика считается по каждому ученику</div></div>
        <button class="btn sm" id="newgroup">Новая группа</button></div>
      <table><thead><tr>
        <th>Группа</th><th>Предмет</th><th class="num">Состав</th><th class="num">Точность</th>
        <th class="num">Посещ.</th><th>Ближайшее занятие</th><th>Набор</th><th></th>
      </tr></thead><tbody>${rows}</tbody></table>
    </section>`;
  }

  UI.page({
    session: ses,
    active: 'groups',
    head: { title:'Группы',
      sub:`${groups.length} ${C.plural(groups.length,'группа','группы','групп')}`,
      actions:`<a class="btn ghost" href="/invites.html">Набор в группу</a>` },
    body: tableHTML(),
  });

  const ng = document.getElementById('newgroup');
  if (ng) ng.addEventListener('click', async () => {
    const subj = (tp.subjects || ['inf'])[0];
    const title = prompt('Название группы', 'ЕГЭ ' + ((C.subject(subj) || {}).name || '').toLowerCase() + ' · вечерняя');
    if (!title) return;
    const schedule = prompt('Расписание (текстом)', 'вт, чт · 19:00') || '';
    const capacity = +prompt('Сколько мест?', '8') || 8;
    try {
      const res = await Api.createGroup({ subjectId: subj, title, schedule, capacity });
      location.href = '/group.html?group=' + res.id;
    } catch (e) { alert(e.message); }
  });
})();
</script>
</body>
</html>
