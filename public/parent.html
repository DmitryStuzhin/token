<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кабинет родителя — Token</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<script src="/api/v1/screens/parent.js"></script>
<script src="/shared/core.js"></script>
<script src="/assets/store.js"></script>
<script src="/assets/api.js"></script>
<script src="/assets/auth.js"></script>
<script src="/assets/ui.js"></script>
<script>
(function () {
  const ses = Auth.require();
  if (!ses) return;

  UI.page({
    session: ses,
    active: 'progress',
    head: { title:'Кабинет родителя', sub:'Пока не реализован' },
    body: `<div style="max-width:640px">
      <section class="card">
        <div class="head"><h2>Раздел в работе</h2><span class="badge b-amber">скоро</span></div>
        <p style="font-size:15px;line-height:1.6;margin-bottom:14px">
          Родительский доступ спроектирован, но ещё не собран. Регистрация с ролью
          «Родитель» временно закрыта — на экране входа она отмечена как недоступная.
        </p>
        <div class="field"><div class="k">Что здесь будет</div>
          <div class="v" style="font-weight:400;font-size:14px">
            Прогресс ребёнка, расписание и посещаемость, статусы и оценки домашних заданий,
            недельная сводка и оплата абонемента.</div></div>
        <div class="field" style="margin-bottom:0"><div class="k">Чего здесь не будет</div>
          <div class="v" style="font-weight:400;font-size:14px">
            Содержимого решений ребёнка и внутренних заметок репетитора. Доступ только на чтение:
            родитель не сдаёт задания и не отменяет занятия за ребёнка.</div></div>
      </section>

      <div class="note n-blue" style="margin-top:14px">
        <b>Как это устроено в модели.</b> Родитель — не поле в профиле ученика, а связь
        <code>Guardian</code> (N—N: у ребёнка бывает двое родителей, у родителя несколько детей)
        со статусом подтверждения. Плательщик хранится отдельно от ученика
        (<code>payer_user_id</code>), потому что платит обычно родитель, а учится ребёнок.
        Доступ выдаётся ссылкой-приглашением с <code>kind: guardian</code> — механизм
        приглашений уже работает, осталось собрать сами экраны.
      </div>

      <a class="btn ghost" style="margin-top:14px" href="${ses.home}">Вернуться в кабинет</a>
    </div>`,
  });
})();
</script>
</body>
</html>
