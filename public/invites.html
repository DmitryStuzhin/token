<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Приглашения — Token</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<script src="/api/v1/screens/invites.js"></script>
<script src="/shared/core.js"></script>
<script src="/assets/store.js"></script>
<script src="/assets/api.js"></script>
<script src="/assets/auth.js"></script>
<script src="/assets/ui.js"></script>
<script>
(function () {
  const ses = Auth.require('tutor');
  if (!ses) return;
  const C = Core;
  const T = ses.tutorId;
  const tp = C.tutorProfile(T);
  const groups = C.groupsOfTutor(T);
  const invites = C.invitesOfTutor(T)
    .slice().sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
  const active = invites.filter(i => C.inviteState(i).ok);

  const KIND = {
    enrollment: { label:'индивидуально', cls:'b-blue' },
    group:      { label:'в группу',      cls:'b-violet' },
    guardian:   { label:'родителю',      cls:'b-amber' },
  };

  /* ── как это работает ───────────────────────────────────────── */
  function howHTML() {
    return `<section class="card">
      <div class="head"><div><h2>Как ученик попадает к вам</h2>
        <div class="hint">Привязку создаёт сам ученик — вручную никого заводить не нужно</div></div></div>
      <div class="steps">
        <div class="step"><span class="badge b-blue">1</span>
          <span><b>Выпустите ссылку</b><span class="muted small">форма ниже: предмет или группа, лимит переходов</span></span></div>
        <div class="step"><span class="badge b-blue">2</span>
          <span><b>Отправьте ученику</b><span class="muted small">он увидит вас, предмет и что появится в его кабинете</span></span></div>
        <div class="step"><span class="badge b-blue">3</span>
          <span><b>Он нажимает «Присоединиться»</b><span class="muted small">ученик появляется во вкладке «Ученики»</span></span></div>
      </div>
    </section>`;
  }

  /* ── выпуск новой ссылки ────────────────────────────────────── */
  function formHTML() {
    const subjOpts = (tp.subjects || []).map(id =>
      `<option value="${id}">${UI.esc((C.subject(id) || {}).name || id)}</option>`).join('');
    const grpOpts = groups.map(g => `<option value="${g.id}">${UI.esc(g.title)}</option>`).join('');
    return `<section class="card">
      <div class="head"><div><h2>Новая ссылка</h2>
        <div class="hint">Код латиницей — его удобно продиктовать голосом</div></div></div>
      <div class="form-row">
        <label class="fld">
          <span>Тип</span>
          <select id="f-kind">
            <option value="enrollment">индивидуальные занятия</option>
            <option value="group" ${groups.length ? '' : 'disabled'}>вступление в группу${groups.length ? '' : ' — групп нет'}</option>
          </select>
        </label>
        <label class="fld" id="w-subj">
          <span>Предмет</span>
          <select id="f-subj">${subjOpts}</select>
        </label>
        <label class="fld" id="w-grp" hidden>
          <span>Группа</span>
          <select id="f-grp">${grpOpts}</select>
        </label>
        <label class="fld" style="max-width:130px">
          <span>Лимит переходов</span>
          <input id="f-max" type="number" min="1" value="5">
        </label>
        <button class="btn" id="f-make">Создать ссылку</button>
      </div>
      <div id="f-out"></div>
    </section>`;
  }

  /* ── список ─────────────────────────────────────────────────── */
  function listHTML() {
    if (!invites.length) return `<section class="card">
      <div class="head"><h2>Выпущенные ссылки</h2></div>
      ${UI.empty('Ссылок пока нет', 'Создайте первую — форма выше.')}</section>`;

    const rows = invites.map(i => {
      const st = C.inviteState(i);
      const t = C.inviteTarget(i);
      const left = i.maxUses == null ? '∞' : Math.max(0, i.maxUses - i.usedCount);
      const k = KIND[i.kind] || KIND.enrollment;
      return `<tr>
        <td><code class="code">${UI.esc(i.code)}</code></td>
        <td><span class="badge ${k.cls}">${k.label}</span></td>
        <td class="muted small">${t.group ? UI.esc(t.group.title)
          : t.subject ? UI.esc(t.subject.name) : '—'}</td>
        <td class="num">${i.usedCount}</td>
        <td class="num">${left}</td>
        <td class="muted small">${i.expiresAt ? C.fmtDate(i.expiresAt) : 'бессрочно'}</td>
        <td>${st.ok ? '<span class="badge b-green">активна</span>'
             : `<span class="badge b-grey">${UI.esc(st.label)}</span>`}</td>
        <td class="num" style="white-space:nowrap">
          <button class="btn sm ghost copy" data-code="${UI.esc(i.code)}">Копировать</button>
          <a class="btn sm grey" href="/invite.html?code=${encodeURIComponent(i.code)}">Открыть</a>
          ${st.ok ? `<button class="btn sm grey revoke" data-id="${i.id}">Отозвать</button>` : ''}
        </td>
      </tr>`;
    }).join('');

    return `<section class="card">
      <div class="head"><div><h2>Выпущенные ссылки</h2>
        <div class="hint">${active.length} ${C.plural(active.length,'активная','активные','активных')}
          из ${invites.length}</div></div></div>
      <table><thead><tr>
        <th>Код</th><th>Тип</th><th>Куда</th><th class="num">Переходов</th>
        <th class="num">Осталось</th><th>Действует до</th><th>Статус</th><th></th>
      </tr></thead><tbody>${rows}</tbody></table>
      <div class="note n-grey" style="margin-top:14px">
        Принятие ссылки создаёт привязку <code>Enrollment</code> или участие
        <code>GroupMember</code>. Отозванная ссылка перестаёт работать сразу,
        но уже присоединившиеся ученики остаются.
      </div>
    </section>`;
  }

  UI.page({
    session: ses,
    active: 'invites',
    head: { title:'Приглашения',
      sub:`${active.length} ${C.plural(active.length,'действующая ссылка','действующие ссылки','действующих ссылок')}`,
      actions:`<a class="btn ghost" href="/students.html">Мои ученики</a>` },
    body: `<div class="stack">${howHTML()}${formHTML()}${listHTML()}</div>`,
  });

  /* ── интерактив ─────────────────────────────────────────────── */
  const kind = document.getElementById('f-kind');
  kind.addEventListener('change', () => {
    document.getElementById('w-grp').hidden = kind.value !== 'group';
    document.getElementById('w-subj').hidden = kind.value === 'group';
  });

  document.getElementById('f-make').addEventListener('click', async () => {
    const btn = document.getElementById('f-make');
    const out = document.getElementById('f-out');
    btn.disabled = true;
    try {
      const data = {
        kind: kind.value,
        maxUses: +document.getElementById('f-max').value || null,
        note: kind.value === 'group' ? 'Набор в группу' : 'Индивидуальные занятия',
      };
      if (kind.value === 'group') {
        data.groupId = document.getElementById('f-grp').value;
        if (!data.groupId) throw new Error('Сначала создайте группу');
      } else {
        data.subjectId = document.getElementById('f-subj').value;
        if (!data.subjectId) throw new Error('Выберите предмет');
      }
      const res = await Api.createInvite(data);
      const url = C.inviteUrl(res.invite.code);
      out.innerHTML = `
        <div class="verdict v-ok" style="margin-top:14px">Ссылка создана — код <b>${UI.esc(res.invite.code)}</b></div>
        <div class="editor" style="margin-top:10px">
          <div class="ehead"><span>отправьте ученику</span><span>переходов: 0</span></div>
          <pre style="min-height:0;white-space:pre-wrap;word-break:break-all">${UI.esc(url)}</pre>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
          <button class="btn sm" id="f-copy">Скопировать</button>
          <a class="btn sm ghost" href="/invite.html?code=${encodeURIComponent(res.invite.code)}">Открыть</a>
          <button class="btn sm grey" id="f-refresh">Обновить список</button>
        </div>`;
      document.getElementById('f-copy').addEventListener('click', e => UI.copy(url, e.target));
      document.getElementById('f-refresh').addEventListener('click', () => location.reload());
    } catch (e) {
      out.innerHTML = `<div class="verdict v-no" style="margin-top:14px">${UI.esc(e.message)}</div>`;
    }
    btn.disabled = false;
  });

  document.querySelectorAll('.copy').forEach(b =>
    b.addEventListener('click', () => UI.copy(C.inviteUrl(b.dataset.code), b)));

  document.querySelectorAll('.revoke').forEach(b =>
    b.addEventListener('click', async () => {
      if (!confirm('Отозвать ссылку? Присоединиться по ней больше нельзя.')) return;
      try { await Api.revokeInvite(b.dataset.id); location.reload(); }
      catch (e) { alert(e.message); }
    }));
})();
</script>
</body>
</html>
