<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кабинет ученика — Token</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<script src="assets/db.js"></script>
<script src="assets/core.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/ui.js"></script>
<script>
(function () {
  const ses = Auth.require('student');
  if (!ses) return;
  const C = Core;
  const S = ses.studentId;
  const me = C.studentUser(S);
  const subjects = C.subjectsOf(S);
  let subj = UI.subjectId(S);

  /* ── ближайшее занятие ─────────────────────────────────────── */
  function bannerHTML() {
    const nl = C.nextLesson(S, subj);
    if (!nl) return `<div class="card" style="margin-bottom:14px">${UI.empty(
      'Занятий не запланировано', 'Расписание появится, когда репетитор поставит занятие.')}</div>`;
    const call = (nl.links || []).find(l => l.type === 'call');
    const live = C.lessonIsLive(nl);
    const grp = C.isGroupLesson(nl) ? C.group(nl.groupId) : null;
    return `
      <section class="banner">
        <div>
          <div class="lbl">${live ? '● занятие идёт' : 'следующее занятие'}</div>
          <div class="val">${UI.esc(C.subject(nl.subjectId).name)} ·
            ${C.relDay(nl.startsAt) || C.fmtDate(nl.startsAt)} в ${C.fmtTime(nl.startsAt)}</div>
          <div class="meta">${nl.durationMin} минут ·
            ${grp ? 'группа «' + UI.esc(grp.title) + '»' : 'индивидуально'} ·
            ${(nl.taskIds || []).length
              ? nl.taskIds.length + ' ' + C.plural(nl.taskIds.length,'задание','задания','заданий') + ' прикреплено'
              : 'заданий пока нет'}</div>
        </div>
        <div class="acts">
          <a class="btn white" href="lesson.html?lesson=${nl.id}">Открыть занятие</a>
          ${call ? `<a class="btn ghost" style="color:#fff;border-color:rgba(255,255,255,.6)"
                       href="${call.url}" target="_blank" rel="noopener">Подключиться</a>` : ''}
        </div>
      </section>`;
  }

  /* ── KPI ────────────────────────────────────────────────────── */
  function kpiHTML() {
    const k = C.kpi(S, subj);
    const cells = [
      { v: k.accuracy == null ? '—' : k.accuracy + '%', s:'верных ответов', c:'k-green' },
      { v: k.solvedWeek, s:'задач за неделю', c:'k-blue' },
      { v: k.streak + ' ' + C.plural(k.streak,'день','дня','дней'), s:'серия занятий', c:'k-amber' },
      { v: k.overdue, s:'д/з не сдано', c: k.overdue ? 'k-red' : 'k-green' },
    ];
    return `<section class="kpis">${cells.map(c =>
      `<div class="kpi ${c.c}"><b>${c.v}</b><span>${c.s}</span></div>`).join('')}</section>`;
  }

  /* ── неделя ─────────────────────────────────────────────────── */
  function weekHTML() {
    const week = C.dailyActivity(S, 7, subj);
    const names = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
    const today = new Date().setHours(0,0,0,0);
    const cells = week.map(d => {
      const cls = ['day', d.solved ? 'has' : '', d.date.getTime() === today ? 'today' : ''].filter(Boolean).join(' ');
      return `<div class="${cls}" title="${d.solved} ${C.plural(d.solved,'задача','задачи','задач')}, ${C.fmtDurShort(d.seconds)}">
        <div class="d">${names[d.date.getDay()]}</div><div class="n">${d.date.getDate()}</div></div>`;
    }).join('');
    const total = week.reduce((s, d) => s + d.solved, 0);
    const secs = week.reduce((s, d) => s + d.seconds, 0);
    return `<div class="card">
      <div class="head"><h2>Эта неделя</h2>
        <span class="muted small">${total} ${C.plural(total,'задача','задачи','задач')} · ${C.fmtDur(secs)}</span></div>
      <div class="week">${cells}</div>
      <div class="heat-scale" style="margin-top:14px">
        <span><i style="background:var(--brand)"></i> сегодня</span>
        <span><i style="background:var(--brand-soft)"></i> были решения</span>
        <span><i style="background:var(--line)"></i> пусто</span>
      </div></div>`;
  }

  /* ── слабые темы ────────────────────────────────────────────── */
  function masteryHTML() {
    const mastery = C.topicMastery(S, subj).slice(0, 4);
    if (!mastery.length) return `<div class="card"><div class="head"><h2>Слабые темы</h2></div>
      ${UI.empty('Пока нет данных', 'Появятся после первых решённых задач.')}</div>`;
    const rows = mastery.map(m => `
      <div style="margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px;gap:10px">
          <b>${m.topic.name}</b>
          <span class="muted">${m.percent}%${m.delta != null
            ? ` <em style="font-style:normal;font-weight:650;color:${m.delta >= 0 ? 'var(--green)' : 'var(--red)'}">${m.delta >= 0 ? '↑' : '↓'} ${Math.abs(m.delta)}</em>`
            : ''}</span>
        </div>${UI.bar(m.percent, UI.pctColor(m.percent))}</div>`).join('');
    return `<div class="card">
      <div class="head"><h2>Слабые темы</h2><a href="stats.html?subject=${subj}">вся статистика</a></div>
      ${rows}</div>`;
  }

  /* ── ближайшие дела ─────────────────────────────────────────── */
  function todoHTML() {
    const todo = C.upcoming(S, 5, subj);
    if (!todo.length) return `<section class="card">
      <div class="head"><h2>Ближайшие задачи</h2></div>
      ${UI.empty('Всё сделано', 'Новые задания появятся после занятия.')}</section>`;

    const rows = todo.map(t => {
      if (t.kind === 'lesson') {
        const grp = C.isGroupLesson(t.meta) ? C.group(t.meta.groupId) : null;
        return `<a class="row" href="lesson.html?lesson=${t.meta.id}">
          <span class="badge b-violet">занятие</span>
          <span class="grow"><span class="t">${UI.esc(t.title)}</span>
            <span class="s">${grp ? UI.esc(grp.title) : 'индивидуально'} · ${t.meta.durationMin} мин</span></span>
          <span class="r">${C.relDay(t.dueAt) || C.fmtDate(t.dueAt)}<br>${C.fmtTime(t.dueAt)}</span></a>`;
      }
      const a = t.meta, left = a.daysLeft;
      const when = left < 0 ? `просрочено на ${Math.abs(left)} ${C.plural(Math.abs(left),'день','дня','дней')}`
                 : left === 0 ? 'сегодня' : `осталось ${left} ${C.plural(left,'день','дня','дней')}`;
      return `<a class="row" href="homework.html#${a.id}">
        ${UI.badge(a.status)}
        <span class="grow"><span class="t">${UI.esc(a.title)}</span>
          <span class="s">${a.isGroup ? 'группа · ' : ''}${a.done} из ${a.total} · ${C.fmtDurShort(a.seconds)}</span></span>
        <span class="r">${when}<br>до ${C.fmtDate(a.dueAt)}</span></a>`;
    }).join('');

    return `<section class="card">
      <div class="head"><h2>Ближайшие задачи</h2><a href="homework.html">смотреть все</a></div>
      <div class="row-list">${rows}</div></section>`;
  }

  /* ── цель, репетитор, абонемент ─────────────────────────────── */
  function goalHTML() {
    const goal = C.goalProgress(S, subj);
    if (!goal || goal.current == null) return '';
    return `<div class="card">
      <div class="head"><h2>Цель · ${UI.esc(goal.subject.short || goal.subject.name)}</h2>
        <span class="muted small">${goal.goal.targetScore} баллов</span></div>
      <div style="font-size:22px;font-weight:750;letter-spacing:-.02em;color:var(--brand);margin-bottom:10px">
        До экзамена: ${goal.daysToExam} ${C.plural(goal.daysToExam,'день','дня','дней')}</div>
      ${UI.bar(goal.percent)}
      <div class="muted small" style="margin-top:8px">
        ${goal.current} из ${goal.target} ${C.plural(goal.target,'балла','баллов','баллов')} · осталось ${goal.left}</div>
    </div>`;
  }

  function tutorHTML() {
    const t = C.tutorOf(S, subj);
    if (!t) return '';
    const grp = C.groupsOf(S, subj)[0];
    return `<div class="card">
      <div class="head"><h2>Репетитор</h2>${UI.subjectTag(C.subject(subj))}</div>
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
        ${UI.avatar(t.user.name, 'blue')}
        <div style="flex:1;min-width:120px">
          <b style="display:block">${UI.esc(t.user.name)}</b>
          <span class="muted small">${grp ? 'группа «' + UI.esc(grp.title) + '»' : 'индивидуально'}</span>
        </div>
      </div>
      <div class="hint" style="margin-top:12px">
        ${t.via === 'group' ? 'Вы попали к репетитору через группу.' : 'Индивидуальная привязка.'}
        Присоединиться к ещё одному предмету можно по ссылке-приглашению.
      </div>
      <a class="btn ghost sm" style="margin-top:12px" href="invite.html">Ввести код приглашения</a>
    </div>`;
  }

  function subHTML() {
    const sub = C.subscriptionOf(S);
    if (!sub) return '';
    const low = sub.lessonsLeft <= 1;
    return `<div class="card">
      <div class="head"><h2>Абонемент</h2>${low ? '<span class="badge b-red">заканчивается</span>' : ''}</div>
      <div style="font-size:19px;font-weight:750;color:${low ? 'var(--red)' : 'var(--amber)'}">
        Осталось занятий: ${sub.lessonsLeft}</div>
      <div class="muted small" style="margin-top:4px">
        ${sub.nextChargeAt ? 'Списание ' + C.fmtDate(sub.nextChargeAt) + ' · ' + C.fmtMoney(sub.price) : 'Списаний нет'}</div>
      <div class="note n-grey" style="margin-top:12px">Платежи в прототипе не подключены.</div>
    </div>`;
  }

  function render() {
    document.getElementById('content').innerHTML = `
      ${bannerHTML()}
      ${kpiHTML()}
      <section class="cols c2w">${weekHTML()}${masteryHTML()}</section>
      ${todoHTML()}
      <section class="cols c3" style="margin-top:14px">${goalHTML()}${tutorHTML()}${subHTML()}</section>`;
  }

  const k = C.kpi(S, subj);
  UI.page({
    session: ses,
    active:'home',
    head:{
      title:`Привет, ${me.name.split(' ')[0]}!`,
      sub: C.fmtDateFull(Date.now()) + ' · ' + subjects.map(s => s.name).join(', '),
      actions: UI.subjectSwitcher(S, subj) +
        `<span class="badge b-amber" style="font-size:13px;padding:8px 14px;margin-left:8px">🔥 ${k.streak} ${C.plural(k.streak,'день','дня','дней')}</span>`,
    },
    body:'',
  });
  UI.bindSubjectSwitcher(id => { subj = id; render(); });
  render();
})();
</script>
</body>
</html>
